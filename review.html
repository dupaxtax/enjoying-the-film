<!DOCTYPE html>



<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
        <title>Review | Enjoying The Film</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "icon" href = "https://markleisherproductions.com/wp-content/uploads/2021/01/logo-placeholder-png-2.png">
    </head>
    <body>
        <div id = "site-header"></div>
        <script src = "menu-loader.js"></script>

        <div id = "review-content"></div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('movie');
            const container = document.getElementById('review-content');

            // Converts lightweight markup in review text to HTML:
            // *italic*, **bold**, [link text](url)
            function formatText(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            }

            // Builds a 5-star display supporting half-star ratings:
            // full star, half star (full star clipped over an empty one), empty star
            function renderStars(rating) {
                let html = '';
                if (rating === '') return html;
                for (let i = 1; i <= 5; i++) {
                    if (rating >= i) html += '&#9733;';
                    else if (rating >= i - 0.5) html += '<span class="star-half"><span class="star-half-fill">&#9733;</span>&#9733;</span>';
                    else html += '&#9734;';
                }
                return html;
            }

            if (!slug) {
                container.innerHTML = '<div class="review-detail"><p>No review specified. <a href="movies.html">Back to reviews</a></p></div>';
            } else {
                fetch('movie-reviews.json')
                    .then(response => response.json())
                    .then(data => {
                        const review = data.reviews.find(r => r.slug === slug);
                        if (!review) {
                            container.innerHTML = '<div class="review-detail"><p>Review not found. <a href="movies.html">Back to reviews</a></p></div>';
                            return;
                        }

                        document.title = review.title + ' | Enjoying The Film';

                        const stars = renderStars(review.rating);
                        const paragraphs = review.body.split(/\n\n+/);
                        const deck = review.deck || (paragraphs[0].includes('. ') ? paragraphs[0].split('. ')[0] + '.' : paragraphs[0]);

                        container.innerHTML = `
                            <main class="review-page">
                                <a href="movies.html" class="review-back">&larr; Back to Reviews</a>
                                <section class="review-hero" style="background-image: url('${review.thumbnail}')">
                                    <div class="review-hero-overlay">
                                        <span class="review-hero-tag">Movie Review</span>
                                        <h1 class="review-detail-title">${review.title}</h1>
                                        <p class="review-deck">${formatText(deck)}</p>
                                    </div>
                                </section>
                                <div class="review-caption">Image courtesy of Unsplash</div>

                                <section class="review-article-layout">
                                    <aside class="review-byline">
                                        <div class="review-author-avatar">${review.author.charAt(0)}</div>
                                        <div>
                                            <div>By <strong>${review.author}</strong></div>
                                            <div class="review-date">${review.date}</div>
                                        </div>
                                    </aside>

                                    <article class="review-body">
                                        <div class="review-stars">${stars}</div>
                                        ${paragraphs.map(p => p.startsWith('> ')
                                            ? `<blockquote>${formatText(p.slice(2))}</blockquote>`
                                            : `<p>${formatText(p)}</p>`).join('')}
                                    </article>

                                <!--     <aside class="review-newsletter"> -->
                                <!--         <h2>Enjoying The Film Newsletter</h2> -->
                                <!--         <p>Movie thoughts, quick hits, and new reviews straight to your inbox.</p> -->
                                <!--     </aside> -->
                                <!-- </section> -->
                            </main>
                        `;
                    })
                    .catch(error => {
                        console.error('Error loading review:', error);
                        container.innerHTML = '<div class="review-detail"><p>Error loading review. <a href="movies.html">Back to reviews</a></p></div>';
                    });
            }
        </script>

        <div id = "site-footer"></div>
    </body>
</html>
