<!DOCTYPE html>



<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
        <title>Movies | Enjoying The Film</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "icon" href = "https://markleisherproductions.com/wp-content/uploads/2021/01/logo-placeholder-png-2.png">
    </head>
    <body>
        <div id = "site-header"></div>
        <script src = "menu-loader.js"></script>

        <div class = "heading">
            <div style = "font-size: 70px; text-align: center;">Movie Reviews</div>
        </div>

        <div class = "divider"></div>

        <div class = "reviews-grid" id = "reviews-grid"></div>

        <script>
            fetch('movie-reviews.json')
                .then(response => response.json())
                .then(data => {
                    const grid = document.getElementById('reviews-grid');
                    const sorted = data.reviews.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
                    data.reviews.forEach(review => {
                        const card = document.createElement('a');
                        card.className = 'review-card';
                        card.href = 'review.html?movie=' + review.slug;
                        card.style.backgroundImage = `url('${review.thumbnail}')`;
                        card.innerHTML = `
                            <div class = "review-card-overlay">
                                <span class = "review-card-tag">Movie Review</span>
                                <h3 class = "review-card-title">${review.title}</h3>
                                <div class = "review-card-author">
                                    <div class = "review-card-avatar"></div>
                                    <span>By ${review.author}</span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => console.error('Error loading reviews:', error));
        </script>

        <div id = "site-footer"></div>
    </body>

</html>
