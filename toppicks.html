<!DOCTYPE html>



<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
        <title>Our Top Picks | Enjoying The Film</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "icon" href = "https://markleisherproductions.com/wp-content/uploads/2021/01/logo-placeholder-png-2.png">
    </head>

    <body>
        <div id = "site-header"></div>
        <script src = "menu-loader.js"></script>

        <div class = "heading" style = "font-size: 70px; text-align: center;">
            Our Top Picks
        </div>

        <div class = "divider"></div>

        <div class = "container" id = "top-picks-container"></div>

        <script>
            fetch('top-picks.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('top-picks-container');
                    data.categories.forEach(category => {
                        const card = document.createElement('div');
                        card.className = 'list';

                        const title = document.createElement('div');
                        title.textContent = category.title;
                        card.appendChild(title);

                        const ol = document.createElement('ol');
                        category.items.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ol.appendChild(li);
                        });
                        card.appendChild(ol);

                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error loading top picks:', error);
                });
        </script>

        <div id = "site-footer"></div>
    </body>
</html>
